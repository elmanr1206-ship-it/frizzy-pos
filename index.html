<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>FRIZZY · POS</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <main class="app">
        <!-- COLUMNA IZQUIERDA -->
        <div>
            <form id="orderForm" class="panel">
                <span class="banner">NUEVO PEDIDO</span>
                
                <label class="seccion-titulo" for="nombreCliente">NOMBRE DEL CLIENTE</label>
                <input type="text" id="nombreCliente" placeholder="Ej. Camila" required>
                
                <label class="habeas-data">
                    <input type="checkbox" id="habeasData" required>
                    ACEPTO TRATAMIENTO DE DATOS (LEY 1581).
                </label>

                <label class="seccion-titulo">BOWL BASE</label>
                <div class="choice-grid" id="bowlGrid"></div>

                <label class="seccion-titulo">ACOMPAÑANTES</label>
                <div class="choice-grid" id="acompGrid"></div>

                <label class="seccion-titulo">TOPPINGS</label>
                <div class="choice-grid" id="toppingGrid"></div>

                <label class="seccion-titulo">MEDIO DE PAGO</label>
                <div class="choice-grid" id="payGrid"></div>
                
                <div class="total-bar">
                    <div class="label">TOTAL DEL PEDIDO</div>
                    <div class="amount" id="totalPedido">$0</div>
                </div>
                
                <button type="submit" class="btn-guardar" id="btnGuardar" disabled>GUARDAR PEDIDO</button>
            </form>
            
            <!-- Listas Offline (Ocultas por defecto si están vacías, funcionales para SRP) -->
            <div id="ordersListContainer" class="panel" style="display:none;">
                <span class="banner">PEDIDOS EN COLA OFFLINE</span>
                <div id="ordersList"></div>
            </div>
        </div>

        <!-- COLUMNA DERECHA -->
        <div>
            <div class="panel" id="summaryCapture" style="position:sticky; top:20px;">
                <span class="banner">CIERRE DE CAJA</span>
                
                <div class="stat-block">
                    <div class="n" id="statPedidos">0</div>
                    <div class="l">Pedidos hoy</div>
                </div>
                <div class="stat-block" style="margin-bottom: 24px;">
                    <div class="n" id="statTotal">$0</div>
                    <div class="l">Ventas hoy</div>
                </div>

                <span class="banner">POR MEDIO DE PAGO</span>
                <div id="paySummary" style="margin-bottom: 24px;"></div>

                <div class="l" style="margin-bottom: 8px;">Descargar reporte del día</div>
                <div class="export-row">
                    <button type="button" class="btn-sm" id="btnExcel">Excel</button>
                    <button type="button" class="btn-sm" id="btnImagen">Imagen</button>
                </div>
                
                <button type="button" class="btn-cerrar" id="btnCerrarDia">CERRAR DÍA / REINICIAR</button>
            </div>
        </div>
    </main>

    <div id="toast"></div>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
