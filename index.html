<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>FRIZZY · POS</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="manifest" href="/manifest.json">
    <!-- Librerías para exportar reportes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-wrap">
            <h1 style="color: var(--dorado-claro); font-family: sans-serif; letter-spacing: 2px;">FRIZZY POS</h1>
            <div class="tagline">Crujientes por fuera, suaves por dentro</div>
        </div>
    </header>

    <main class="app">
        <!-- COLUMNA IZQUIERDA -->
        <div>
            <form id="orderForm" class="panel">
                <span class="banner">Nuevo pedido</span>
                <div class="field">
                    <label for="nombreCliente">Nombre del cliente</label>
                    <input type="text" id="nombreCliente" placeholder="Ej. Camila" required>
                    <label class="habeas-data">
                        <input type="checkbox" id="habeasData" required>
                        Acepto tratamiento de datos (Ley 1581).
                    </label>
                </div>
                <div class="field"><label>Bowl base</label><div class="choice-grid" id="bowlGrid"></div></div>
                <div class="field"><label>Acompañantes</label><div class="choice-grid" id="acompGrid"></div></div>
                <div class="field"><label>Toppings</label><div class="choice-grid" id="toppingGrid"></div></div>
                <div class="field"><label>Medio de pago</label><div class="pay-grid" id="payGrid"></div></div>
                
                <div class="total-bar">
                    <div><div class="label">Total del pedido</div><div class="amount" id="totalPedido">$0</div></div>
                </div>
                
                <button type="submit" class="btn-guardar" id="btnGuardar" disabled>Guardar pedido</button>
                <button type="button" class="btn-secundario" id="btnApartar" disabled>Apartar para después</button>
            </form>

            <div class="panel orders-panel">
                <span class="banner">Apartados (Para después)</span>
                <div id="apartadosList"></div>
            </div>

            <div class="panel orders-panel">
                <span class="banner">Pedidos de hoy (Sincronización)</span>
                <div id="ordersList"></div>
            </div>
        </div>

        <!-- COLUMNA DERECHA -->
        <div>
            <div class="panel" style="position:sticky; top:14px;">
                <div id="summaryCapture">
                    <span class="banner small">Cierre de caja</span>
                    <div class="summary-grid">
                        <div class="stat"><div class="n" id="statPedidos">0</div><div class="l">Pedidos hoy</div></div>
                        <div class="stat"><div class="n" id="statTotal">$0</div><div class="l">Ventas hoy</div></div>
                    </div>
                    <span class="banner small">Por medio de pago</span>
                    <div class="pay-summary" id="paySummary"></div>
                </div>

                <p class="subhead" style="margin-top: 20px;">Descargar reporte del día</p>
                <div class="export-row">
                    <button type="button" class="btn-export" id="btnExcel">Excel</button>
                    <button type="button" class="btn-export" id="btnImagen">Imagen</button>
                </div>
                <button type="button" class="btn-secundario" id="btnCerrarDia">Cerrar día / Reiniciar</button>
            </div>
        </div>
    </main>

    <div id="toast"></div>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
