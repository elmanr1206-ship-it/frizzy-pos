<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frizzy | Dashboard Administrativo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --fondo: #F7EFDD; --primario: #5F2C82; --texto: #333; }
        body { font-family: 'Nunito', sans-serif; background: var(--fondo); margin: 0; padding: 20px; color: var(--texto); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .kpi-card h3 { margin: 0 0 10px 0; font-size: 1rem; color: #666; }
        .kpi-card h2 { margin: 0; font-size: 2rem; color: var(--primario); }
        .grid-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Frizzy Dashboard</h1>
        <a href="index.html" style="text-decoration: none; color: var(--primario); font-weight: bold;">← Volver al POS</a>
    </div>

    <div class="grid-kpi">
        <div class="kpi-card">
            <h3>Ingresos Totales (Histórico)</h3>
            <h2 id="kpiIngresos">$0</h2>
        </div>
        <div class="kpi-card">
            <h3>Pedidos Completados</h3>
            <h2 id="kpiPedidos">0</h2>
        </div>
        <div class="kpi-card">
            <h3>Ticket Promedio</h3>
            <h2 id="kpiTicket">$0</h2>
        </div>
    </div>

    <div class="grid-charts">
        <div class="chart-container">
            <h3 style="text-align: center;">Top Productos Más Vendidos</h3>
            <canvas id="chartProductos"></canvas>
        </div>
        <div class="chart-container">
            <h3 style="text-align: center;">Horas Pico de Ventas</h3>
            <canvas id="chartHoras"></canvas>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
