name: Respaldo diario

on:
  schedule:
    - cron: '0 6 * * *'   # 1:00 a. m. en Bogotá, después del cierre de las 12:00 a. m.
  workflow_dispatch:       # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: respaldo
  cancel-in-progress: false

env:
  SUPABASE_URL: https://satsdiydoeilmdruyiru.supabase.co
  # Clave pública (la misma que ya está en js/api.js). El acceso real lo protege BACKUP_TOKEN.
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhdHNkaXlkb2VpbG1kcnV5aXJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3ODM2NDMsImV4cCI6MjEwNjM1OTY0M30.YMDXmmBrwzeXYKiO2CAA_QR1xrDnGqzgXNhtMrfAvJE

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar, validar y cifrar
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_TOKEN" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Faltan los secretos BACKUP_TOKEN y/o BACKUP_PASSPHRASE (ver RESPALDOS.md)"; exit 1
          fi
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/exportar_respaldo" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$BACKUP_TOKEN" '{p_token: $t}')" -o respaldo.json
          jq -e '.version == 1 and (.pedidos | type == "array") and (.productos | length > 0)' respaldo.json > /dev/null
          echo "Filas: $(jq -c '{clientes: (.clientes | length), pedidos: (.pedidos | length), detalles: (.pedido_detalles | length), productos: (.productos | length)}' respaldo.json)"
          mkdir -p /tmp/out
          F="/tmp/out/respaldo-$(TZ=America/Bogota date +%F).json.gz.enc"
          gzip -9 -c respaldo.json | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -out "$F"
          rm -f respaldo.json

      - name: Guardar en la rama respaldos
        run: |
          set -euo pipefail
          git config user.name "respaldo-bot"
          git config user.email "respaldo-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin respaldos > /dev/null; then
            git fetch origin respaldos
            git checkout -B respaldos origin/respaldos
          else
            git checkout --orphan respaldos
            git rm -rf . > /dev/null
          fi
          mkdir -p respaldos
          cp /tmp/out/* respaldos/
          git add respaldos
          if git diff --cached --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -m "Respaldo $(TZ=America/Bogota date +%F)"
          git push origin respaldos
